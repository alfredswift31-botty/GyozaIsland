name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release under this tag, e.g. v1.2. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      # Ad-hoc signing ("-") so CI needs no certificates. Hardened runtime is
      # off for tests only: its library validation rejects the ad-hoc test
      # bundle injected into the ad-hoc host app.
      - name: Unit tests
        run: |
          xcodebuild test \
            -project GyozaIsland.xcodeproj \
            -scheme GyozaIsland \
            -only-testing:GyozaIslandTests \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO

      - name: Build release app
        run: |
          xcodebuild build \
            -project GyozaIsland.xcodeproj \
            -target GyozaIsland \
            -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Package
        run: |
          codesign --verify --deep --strict build/Release/GyozaIsland.app
          ditto -c -k --keepParent build/Release/GyozaIsland.app GyozaIsland.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GyozaIsland
          path: GyozaIsland.zip

  # Runs for a pushed v* tag, or a manual run given a release tag (GitHub
  # then creates the tag on the built commit).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GyozaIsland

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          TAG="${TAG_INPUT:-$GITHUB_REF_NAME}"
          gh release create "$TAG" GyozaIsland.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gyoza Island ${TAG#v}" \
            --generate-notes
